[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "repo-semantic-memory"
dynamic = ["version"]
description = "Semantic compiler foundation for repository memory artifacts."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "repo-semantic-memory contributors" }]
dependencies = []

[project.scripts]
rsm = "repo_semantic_memory.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.11.0",
  "python-semantic-release>=9.15.0",
  "pytest>=8.2.0",
  "ruff>=0.6.0",
  "pyyaml>=6.0.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[tool.hatch.build.targets.wheel]
packages = ["src/repo_semantic_memory"]

[tool.hatch.version]
source = "vcs"

[tool.semantic_release]
branch = "main"
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = false
upload_to_pypi = false
