project:
  name: repo-semantic-memory
  type: python-semantic-memory
  default_branch: main

paths:
  vault: vault
  rsm_config: .rsm.yaml
  agentic_dir: .agentic

agents:
  odysseus:
    enabled: true
    mode: conversational_intake

  hermes:
    enabled: true
    mode: triage

issue_validator:
  enabled: true

executor:
  enabled: false
  default_backend: aider
  backends:
  - aider
  - copilot-cli

reviewer:
  enabled: false

memory_writer:
  enabled: true

quality:
  required_before_review:
  - ruff
  - pytest
  optional:
  - mypy

memory:
  provider: mempalace_mcp
  palace: agentic-factory
  wing: repo-semantic-memory
  mcp:
    type: stdio
    command: /home/adrienpagon/.local/bin/uv
    args:
      - run
      - --directory
      - /home/adrienpagon/git/mempalace-mcp-bridge
      - python
      - -m
      - mempalace.mcp_server
rsm:
  derived_store: true
  sync_index: false
  version_config_only: true

safety:
  no_automerge: true
  max_files_changed_without_approval: 12
  max_reloops: 2



github:
  owner: apajon
  repo: repo-semantic-memory
  project:
    owner: apajon
    number: 1
    title: RSM Roadmap
  status_field:
    name: Status
    id: PVTSSF_lAHOAG7IRs4BaaxWzhVSius
    mapping:
      backlog: Backlog
      todo: Ready
      doing: Doing
      review: Review
      closed: Done
      deferred: Deferred
      rejected: Deferred
  project_statuses:
    - backlog
    - todo
    - doing
    - review
    - closed
    - deferred
    - rejected
  notes:
    - "Rejected is temporarily mapped to Deferred until the GitHub Project Status field gets a dedicated Rejected option."
