# Pilot manifest for opt-in public-repository retrieval benchmarks.
#
# This file describes external checkouts only. It does not vendor public
# repositories, clone repositories, fetch network resources, or define verified
# gold targets. Placeholder refs and empty gold lists must be replaced after
# local source inspection against the intended pinned revision.

repositories:
  - name: typer
    url: https://github.com/fastapi/typer
    ref: 8c70d4987284a37ca6c418297af0210dc01ed5ac
    size_category: small
    python_first: true
    indexing_risk: low
    checkout:
      mode: external
      path_env: RSM_BENCH_TYPER_PATH
    tasks:
      - id: typer_public_cli_api
        category: public_api_lookup
        prompt: "Find the public API for defining a CLI command."
        curation_status: verified
        gold:
          mode: all_of
          files:
            - typer/main.py
            - typer/__init__.py
          symbols:
            - typer.main.Typer
          alternate_symbols:
            - typer.Typer
          verification_status: verified
          notes: "Verified manually against pinned commit 8c70d4987284a37ca6c418297af0210dc01ed5ac. `Typer` is the main public app object; `__init__.py` exposes public imports. `typer.Typer` is the public re-export alias for `typer.main.Typer`."
      - id: typer_cli_command_registration
        category: implementation_location
        prompt: "Find where CLI command registration is implemented."
        curation_status: verified
        gold:
          mode: all_of
          files:
            - typer/main.py
          symbols:
            - typer.main.Typer.command
            - typer.main.Typer.callback
          verification_status: verified
          notes: "Verified manually against pinned commit 8c70d4987284a37ca6c418297af0210dc01ed5ac. Command/callback registration methods live on `Typer` in `typer/main.py`."
      - id: typer_core_command_behavior_tests
        category: test_regression_location
        prompt: "Find tests using CliRunner, runner.invoke, and app.command for core Typer command behavior."
        curation_status: verified
        gold:
          mode: all_of
          files:
            - tests/test_core.py
            - tests/test_cli/test_extending_app.py
            - tests/test_cli/test_multi_app_cli.py
            - tests/test_cli/test_multi_app.py
          symbols: []
          verification_status: verified
          notes: "Verified manually against pinned commit 8c70d4987284a37ca6c418297af0210dc01ed5ac. The pack surfaces `tests/test_core.py` and CLI multi-app/extending-app tests for command behavior; `tests/test_core.py` covers core command/context invocation, while `tests/test_cli/test_extending_app.py`, `tests/test_cli/test_multi_app_cli.py`, and `tests/test_cli/test_multi_app.py` cover multi-app and extended CLI behavior."

  - name: rich
    url: https://github.com/Textualize/rich
    ref: 46cebbb032f920eb096efbaf23cdc6fe9dd541f7
    size_category: medium
    python_first: true
    indexing_risk: low-medium
    checkout:
      mode: external
      path_env: RSM_BENCH_RICH_PATH
    tasks:
      - id: rich_public_console_api
        category: public_api_lookup
        prompt: "Find the public API for console output."
        curation_status: verified
        gold:
          mode: all_of
          files:
            - rich/console.py
            - rich/__init__.py
          symbols:
            - rich.console.Console
            - rich.console.Console.print
            - rich.console.Console.print_json
            - rich.console.Console.log
            - rich.print
          alternate_symbols:
            - rich.Console
          verification_status: verified
          notes: "Verified manually against pinned commit 46cebbb032f920eb096efbaf23cdc6fe9dd541f7. `Console` is the main public console output object; `Console.print`, `Console.print_json`, and `Console.log` implement primary output APIs, while `rich.__init__.py` exposes the top-level `rich.print` helper. `rich.Console` is the public re-export alias for `rich.console.Console`."
      - id: rich_console_rendering
        category: implementation_location
        prompt: "Find where Rich console rendering is implemented."
        curation_status: verified
        gold:
          mode: all_of
          files:
            - rich/console.py
            - rich/segment.py
            - rich/text.py
          symbols:
            - rich.console.Console
            - rich.segment.Segment
            - rich.text.Text
          verification_status: verified
          notes: "Verified manually against pinned commit 46cebbb032f920eb096efbaf23cdc6fe9dd541f7. `Console` drives console rendering; `Segment` is the rendered output unit; `Text` is a primary renderable text model used by console output."
      - id: rich_console_tests
        category: test_regression_location
        prompt: "Find tests covering Rich console output behavior."
        curation_status: verified
        gold:
          mode: all_of
          files:
            - tests/test_console.py
          symbols: []
          verification_status: verified
          notes: "Verified manually against pinned commit 46cebbb032f920eb096efbaf23cdc6fe9dd541f7. `tests/test_console.py` covers console initialization, printing, markup/highlighting, JSON output, capture, terminal controls, screen updates, exports, Unicode output errors, broken pipes, null stdout/stderr handling, and environment-driven terminal behavior."

  - name: httpx
    url: https://github.com/encode/httpx
    ref: b5addb64f0161ff6bfe94c124ef76f6a1fba5254
    size_category: medium
    python_first: true
    indexing_risk: medium
    checkout:
      mode: external
      path_env: RSM_BENCH_HTTPX_PATH
    tasks:
      - id: httpx_client_public_api
        category: public_api_lookup
        prompt: "Find the public API for making HTTP requests with a client."
        curation_status: verified
        gold:
          mode: all_of
          files:
            - httpx/_client.py
            - httpx/__init__.py
          symbols:
            - httpx._client.Client
            - httpx._client.Client.request
            - httpx._client.Client.stream
            - httpx._client.Client.send
            - httpx._client.AsyncClient
            - httpx._client.AsyncClient.request
            - httpx._client.AsyncClient.stream
            - httpx._client.AsyncClient.send
          alternate_symbols:
            - httpx.Client
            - httpx.AsyncClient
          verification_status: verified
          notes: "Verified manually against pinned commit b5addb64f0161ff6bfe94c124ef76f6a1fba5254. `httpx/__init__.py` exports `Client` and `AsyncClient`; `httpx/_client.py` defines the sync and async client classes plus their primary request APIs (`request`, `stream`, and `send`) and HTTP method helpers. `httpx.Client` and `httpx.AsyncClient` are the public re-export aliases listed under `alternate_symbols`."
      - id: httpx_timeout_configuration
        category: implementation_location
        prompt: "Find where HTTPX defines the Timeout configuration object and default timeout configuration, and how BaseClient applies it."
        curation_status: verified
        gold:
          mode: all_of
          files:
            - httpx/_config.py
            - httpx/_client.py
          symbols:
            - httpx._config.Timeout
            - httpx._config.DEFAULT_TIMEOUT_CONFIG
            - httpx._client.BaseClient.__init__
            - httpx._client.BaseClient.timeout
          verification_status: verified
          notes: "Verified manually against pinned commit b5addb64f0161ff6bfe94c124ef76f6a1fba5254. `Timeout` and `DEFAULT_TIMEOUT_CONFIG` are defined in `httpx/_config.py`; `BaseClient` normalizes timeout values with `Timeout(timeout)` and exposes the timeout property. Prompt refined (52.6) to name target types explicitly and reduce noise from unrelated test files and docs. `httpx/_api.py` removed from gold: it passes timeout through to `Client` but is not an implementation site for timeout configuration."
      - id: httpx_transport_architecture
        category: cross_file_architecture
        prompt: "Find the HTTPX transport implementation modules under _transports, including the base transport interfaces and default HTTP transport implementations."
        curation_status: verified
        gold:
          mode: all_of
          files:
            - httpx/_transports/__init__.py
            - httpx/_transports/base.py
            - httpx/_transports/default.py
          symbols:
            - httpx._transports.base.BaseTransport
            - httpx._transports.base.AsyncBaseTransport
            - httpx._transports.default.HTTPTransport
            - httpx._transports.default.AsyncHTTPTransport
          verification_status: verified
          notes: "Verified manually against pinned commit b5addb64f0161ff6bfe94c124ef76f6a1fba5254. `httpx/_transports/base.py` defines sync and async transport interfaces; `default.py` implements HTTP/httpcore-backed transports; `_transports/__init__.py` exports the transport surface. Prompt refined (52.6): removed ambiguous 'main modules' phrase that lexically matched `httpx/_main.py`; focused on `_transports/` subpackage. Client integration (`_init_transport`, `_transport_for_url`) split into a future task. `mock.py`, `asgi.py`, `wsgi.py` moved to notes: they are alternate transport implementations and are secondary to the base/default task focus."
